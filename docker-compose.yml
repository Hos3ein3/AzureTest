name:
  azuretest

services:
  # ── Application ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azuretest-web
    ports:
      - "8088:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - EmailSettings__Username=${EMAIL_USERNAME}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    depends_on:
      - postgres
      - mongo
      - redis
      - seq
    networks:
      - app-azuretest-network
    # Exposing docker logs for Promtail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  api:
    api:
      build:
        context: .
        dockerfile: Dockerfile
        target: api
      container_name: azuretest-api
      ports:
        - "8089:8080"
      environment:
        - ASPNETCORE_ENVIRONMENT=Production
        - EmailSettings__Username=${EMAIL_USERNAME}
        - EmailSettings__Password=${EMAIL_PASSWORD}
      depends_on:
        - postgres
        - mongo
        - redis
        - seq
      networks:
        - app-azuretest-network
      logging:
        driver: "json-file"
        options:
          max-size: "10m"
          max-file: "3"
  # ── PostgreSQL Database & Admin ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: azuretest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ResumeTrackerDb.Dev
    command: |
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby=on
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-azuretest-network


  pgadmin:
    image: dpage/pgadmin4
    container_name: azuretest-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - app-azuretest-network

  # ── MongoDB & Express ──────────────────────────────────────────────────────
  mongo:
    image: mongo:6
    container_name: azuretest-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - app-azuretest-network

  mongo-express:
    image: mongo-express
    container_name: azuretest-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    networks:
      - app-azuretest-network

  # ── Redis & Dashboard ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: azuretest-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-azuretest-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: azuretest-redisinsight
    ports:
      - "5541:5540"
    depends_on:
      - redis
    networks:
      - app-azuretest-network

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: azuretest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - app-azuretest-network

  # ── Observability: Prometheus & Node Exporter ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: azuretest-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9091:9090"
    networks:
      - app-azuretest-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: azuretest-node-exporter
    ports:
      - "9101:9100"
    networks:
      - app-azuretest-network

  # ── Observability: Loki & Promtail ─────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: azuretest-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-azuretest-network

  tempo:
    image: grafana/tempo:latest
    container_name: azuretest-tempo
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempodata:/var/tempo
    ports:
      - "3200:3200"   # Tempo query API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - app-azuretest-network

  promtail:
    image: grafana/promtail:latest
    container_name: azuretest-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - app-azuretest-network

  # ── Observability: Seq ─────────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    container_name: azuretest-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5342:80"
    volumes:
      - seqdata:/data
    networks:
      - app-azuretest-network

  # ── Observability: Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: azuretest-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - app-azuretest-network
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - app-azuretest-network

networks:
  app-azuretest-network:
    driver: bridge

volumes:
  pgdata:
  pgdata_replica:
  mongodata:
  redisdata:
  prometheusdata:
  grafanadata:
  tempodata:
  seqdata: