version: '3.8'

services:
  # ==============================================================================
  # Angular Universal Paper Trading Terminal & Admin Console
  # ==============================================================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: azuretest-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - azuretest-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==============================================================================
  # ASP.NET Core 10.0 Web API & SignalR Microservices
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: ./src/AzureTest.API/Dockerfile
    container_name: azuretest-api
    restart: unless-stopped
    ports:
      - "5143:5143"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5143
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=AzureTestDb;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;
      - Jwt__Issuer=https://azuretest.io
      - Jwt__Audience=https://azuretest.io
      - Jwt__Secret=SuperSecretTestingSecurityKeyForJwtAuthenticationTokensLong256Bits1234567890
    networks:
      - azuretest-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5143/api/v1/trading/live-status || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  azuretest-network:
    driver: bridge
