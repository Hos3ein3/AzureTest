name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_DIR: "/home/homelabadmin/wwwroot/azuretest/backend"  # or direct path: "/home/ubuntu/projects/src"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Unit Tests (Skipped for now)
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    if: true # Skipped for now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        run: dotnet test test/AzureTest.UnitTest/AzureTest.UnitTest.csproj --configuration Release

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Integration Tests (Skipped for now)
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    if: false # Skipped for now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Integration Tests
        run: dotnet test test/AzureTest.IntegrationTest/AzureTest.IntegrationTest.csproj --configuration Release

  # ─────────────────────────────────────────────────────────────
  # Stage 3: End-to-End Tests (Skipped for now)
  # ─────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    if: false # Skipped for now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Playwright Browsers
        run: |
          dotnet build test/AzureTest.e2eTest/AzureTest.e2eTest.csproj --configuration Release
          pwsh test/AzureTest.e2eTest/bin/Release/net10.0/playwright.ps1 install --with-deps || true

      - name: Run E2E Tests
        run: dotnet test test/AzureTest.e2eTest/AzureTest.e2eTest.csproj --configuration Release

  # ─────────────────────────────────────────────────────────────
  # Stage 4: Build & Deploy to Ubuntu Server
  # ─────────────────────────────────────────────────────────────
  build-and-deploy-mvc:
    name: Build & Deploy on Ubuntu
    # When ready to enforce tests before deploy, uncomment:
    # needs: [unit-tests, integration-tests, e2e-tests]
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code into Runner Workspace
        uses: actions/checkout@v4

      - name: Sync Source Code to projects/src
        run: |
          echo "Syncing code to production directory: projects/src..."
          mkdir -p "$DEPLOY_DIR"
          # Sync code excluding git and local caches
          rsync -av --delete \
            --exclude '.git' \
            --exclude 'bin/' \
            --exclude 'obj/' \
            ./ "$DEPLOY_DIR"/

      - name: Build and Start Containers via Docker Compose
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd "$DEPLOY_DIR"

          echo "Pre-pulling .NET runtime & SDK images..."
          for img in mcr.microsoft.com/dotnet/sdk:10.0 mcr.microsoft.com/dotnet/aspnet:10.0; do
            for i in 1 2 3; do
              docker pull $img && break || (echo "Retry $i for $img..." && sleep 5)
            done
          done

          echo "Building application container..."
          docker compose build

          echo "Starting all services (detached)..."
          docker compose up -d --remove-orphans
          docker compose up -d --force-recreate cloudflared

      - name: MVC Health Check
        run: |
          echo "Verifying application health..."
          end=$((SECONDS+120))
          while [ $SECONDS -lt $end ]; do
            RESPONSE=$(curl -s http://localhost:8088/health || true)
            if echo "$RESPONSE" | grep -q '"status":"Healthy"'; then
              echo "Deployment succeeded! Application is healthy:"
              echo "$RESPONSE"
              exit 0
            fi
            echo "Waiting for web container to report Healthy... Current response: $RESPONSE"
            sleep 5
          done

          echo "Health check timed out! Dumping container logs:"
          docker logs --tail 100 azuretest-web
          docker logs --tail 50 azuretest-seq || true
          exit 1

      - name: API Health Check
        run: |
          end=$((SECONDS+120))
          while [ $SECONDS -lt $end ]; do
            R=$(curl -s http://localhost:8089/health || true)
            if echo "$R" | grep -q '"status":"Healthy"'; then echo "$R"; exit 0; fi
            sleep 5
          done
          docker logs --tail 100 azuretest-api
          exit 1
      - name: Debug cloudflared
        if: always()
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd "$DEPLOY_DIR"
          docker compose ps
          docker compose logs --tail 50 cloudflared