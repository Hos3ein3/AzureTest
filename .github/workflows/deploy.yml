name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_DIR: "/home/homelabadmin/wwwroot/azuretest/src"  # or direct path: "/home/ubuntu/projects/src"

jobs:
  build-and-deploy:
    name: Build & Deploy on Ubuntu
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code into Runner Workspace
        uses: actions/checkout@v4

      - name: Sync Source Code to projects/src
        run: |
          echo "Syncing code to production directory: projects/src..."
          mkdir -p "$DEPLOY_DIR"
          # Sync code excluding git and local caches
          rsync -av --delete \
            --exclude '.git' \
            --exclude 'bin/' \
            --exclude 'obj/' \
            ./ "$DEPLOY_DIR"/

      - name: Build and Start Containers via Docker Compose
        run: |
          cd "$DEPLOY_DIR"

          echo "Pre-pulling .NET runtime & SDK images..."
          for img in mcr.microsoft.com/dotnet/sdk:10.0 mcr.microsoft.com/dotnet/aspnet:10.0; do
            for i in 1 2 3; do
              docker pull $img && break || (echo "Retry $i for $img..." && sleep 5)
            done
          done

          echo "Building application container..."
          docker compose build

          echo "Starting all services (detached)..."
          docker compose up -d --remove-orphans

      - name: Health Check Verification
        run: |
          echo "Verifying application health and dependencies (PostgreSQL, MongoDB, Redis, Seq)..."
          MAX_ATTEMPTS=24
          SLEEP_SECONDS=5

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS: Checking http://localhost:8088/health..."
            RESPONSE=$(curl -s http://localhost:8088/health || true)

            if [ -n "$RESPONSE" ]; then
              STATUS_REPORT=$(python3 -c "
import sys, json

try:
    data = json.loads(sys.argv[1])
    status = data.get('status', 'Unknown')
    entries = data.get('entries', {})
    pg = entries.get('PostgreSQL', {}).get('status', 'Unknown')
    mongo = entries.get('MongoDB', {}).get('status', 'Unknown')
    redis = entries.get('Redis', {}).get('status', 'Unknown')
    seq_entry = entries.get('Seq')
    seq = seq_entry.get('status', 'Unknown') if seq_entry else 'Disabled'

    print(f'Overall={status} | PostgreSQL={pg} | MongoDB={mongo} | Redis={redis} | Seq={seq}')

    seq_ok = (seq == 'Healthy') if seq_entry else True

    if status == 'Healthy' and pg == 'Healthy' and mongo == 'Healthy' and redis == 'Healthy' and seq_ok:
        sys.exit(0)
    else:
        sys.exit(1)
except Exception as e:
    print(f'Parse or connection error: {e}')
    sys.exit(2)
" "$RESPONSE" 2>&1)

              EXIT_CODE=$?
              echo "Status: $STATUS_REPORT"

              # Also verify Seq direct endpoint on host port 5342 if available
              SEQ_DIRECT=$(curl -s http://localhost:5342/health || true)
              if [ -n "$SEQ_DIRECT" ]; then
                echo "Seq Direct (port 5342): $SEQ_DIRECT"
              fi

              if [ $EXIT_CODE -eq 0 ]; then
                echo "Deployment succeeded! Application and all services (PostgreSQL, MongoDB, Redis, Seq) are healthy."
                exit 0
              fi
            else
              echo "No response received yet from web container..."
            fi

            sleep $SLEEP_SECONDS
          done

          echo "Health check timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS)) seconds! Dumping container logs:"
          docker logs --tail 100 azuretest-web
          echo "Dumping Seq container logs:"
          docker logs --tail 50 azuretest-seq || true
          exit 1