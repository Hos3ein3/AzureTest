trigger:
  branches:
    include:
      - main

pool: 'Mac-Local'   # your Mac's agent pool name, not vmImage

variables:
  buildConfiguration: 'Release'

stages:
  - stage: Test
    displayName: 'Run Automated Tests'
    jobs:
      - job: RunTests
        displayName: 'Unit, Integration, and E2E Tests'
        steps:
          - task: DotNetCoreCLI@2
            displayName: 'Restore solution dependencies'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'

#          - task: DotNetCoreCLI@2
#            displayName: 'Run Unit Tests'
#            inputs:
#              command: 'test'
#              projects: 'test/AzureTest.UnitTest/AzureTest.UnitTest.csproj'
#              arguments: '--configuration $(buildConfiguration) --no-restore'
#
#          - task: DotNetCoreCLI@2
#            displayName: 'Run Integration Tests'
#            inputs:
#              command: 'test'
#              projects: 'test/AzureTest.IntegrationTest/AzureTest.IntegrationTest.csproj'
#              arguments: '--configuration $(buildConfiguration) --no-restore'

          - script: |
              dotnet build test/AzureTest.e2eTest/AzureTest.e2eTest.csproj --configuration $(buildConfiguration)
              pwsh test/AzureTest.e2eTest/bin/$(buildConfiguration)/net10.0/playwright.ps1 install
            displayName: 'Install Playwright Browsers'

          - task: DotNetCoreCLI@2
            displayName: 'Run E2E Tests'
            inputs:
              command: 'test'
              projects: 'test/AzureTest.e2eTest/AzureTest.e2eTest.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'

  - stage: BuildAndDeploy
    displayName: 'Build and Deploy to Local Docker'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: DockerDeploy
        displayName: 'Docker Compose Build and Deploy'
        steps:
          - script: |
              docker compose build
            displayName: 'Docker Compose Build'

          - script: |
              echo "Pulling images sequentially to avoid Docker Hub timeouts..."
              for img in postgres:15-alpine dpage/pgadmin4 mongo:6 mongo-express redis:7-alpine rediscommander/redis-commander:latest rabbitmq:3-management-alpine prom/prometheus:latest prom/node-exporter:latest grafana/loki:latest grafana/promtail:latest grafana/grafana:latest; do
                echo "Pulling $img..."
                for i in 1 2 3 4; do
                  docker pull $img && break || (echo "Retry $i for $img in 5 seconds..." && sleep 5)
                done
              done
            displayName: 'Pre-pull Docker Images (Sequential)'

          - script: |
              docker compose up -d
            displayName: 'Docker Compose Up (persist)'

          - script: |
              echo "Waiting for application to become healthy..."
              end=$((SECONDS+60))
              while [ $SECONDS -lt $end ]; do
                if curl -s http://localhost:8080/health | grep -q "Healthy"; then
                  echo "Application is up and healthy!"
                  exit 0
                fi
                echo "Waiting..."
                sleep 5
              done
              echo "Timeout waiting for application to become healthy."
              docker logs azuretest-web
              exit 1
            displayName: 'Verify Application Health'