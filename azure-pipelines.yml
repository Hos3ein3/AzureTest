# Azure DevOps Pipeline
# Builds, pushes to ACR, and deploys to Azure Container App

trigger:
  branches:
    include:
      - main

pr: none  # Don't run on Pull Requests, only on merge to main

variables:
  # Azure Container Registry
  acrName: 'azuretestresumetracker'
  acrLoginServer: 'azuretestresumetracker.azurecr.io'
  imageRepository: 'azuretest-mvc'
  imageTag: '$(Build.BuildId)'
  fullImageName: '$(acrLoginServer)/$(imageRepository):$(imageTag)'

  # Azure Resource Group
  resourceGroup: 'azure-test'

  # Azure Container App — update this to your actual Container App name
  containerAppName: 'azuretest-resume-tracker-app'

  # Service Connection names (must match what you configured in Azure DevOps)
  dockerServiceConnection: 'acr-azuretest'
  armServiceConnection: 'arm-azuretest'

  # Build configuration
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)'

stages:
  # ─────────────────────────────────────────────
  # STAGE 1: Build & Push Docker Image to ACR
  # ─────────────────────────────────────────────
  - stage: Build
    displayName: 'Build & Push to ACR'
    jobs:
      - job: BuildAndPush
        displayName: 'Docker Build and Push'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            displayName: 'Checkout source code'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: '$(acrLoginServer)/$(imageRepository)'
              dockerfile: '$(dockerfilePath)'
              buildContext: '$(buildContext)'
              tags: |
                $(imageTag)
                latest
              containerRegistry: '$(dockerServiceConnection)'

          - task: Docker@2
            displayName: 'Push image to ACR'
            inputs:
              command: push
              repository: '$(acrLoginServer)/$(imageRepository)'
              tags: |
                $(imageTag)
                latest
              containerRegistry: '$(dockerServiceConnection)'

          # Publish the image tag so the Deploy stage can consume it
          - bash: |
              echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$(imageTag)"
            name: setImageTag
            displayName: 'Export image tag for deploy stage'

  # ─────────────────────────────────────────────
  # STAGE 2: Deploy to Azure Container App
  # ─────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to Azure Container App'
    dependsOn: Build
    condition: succeeded()
    variables:
      # Pull the image tag from the Build stage
      IMAGE_TAG: $[ stageDependencies.Build.BuildAndPush.outputs['setImageTag.IMAGE_TAG'] ]
    jobs:
      - deployment: DeployToContainerApp
        displayName: 'Update Container App image'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy new image to Azure Container App'
                  inputs:
                    azureSubscription: '$(armServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying image: $(acrLoginServer)/$(imageRepository):$(IMAGE_TAG)"

                      az containerapp update \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --image "$(acrLoginServer)/$(imageRepository):$(IMAGE_TAG)"

                      echo "Deployment complete!"

                - task: AzureCLI@2
                  displayName: 'Verify deployment revision is active'
                  inputs:
                    azureSubscription: '$(armServiceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      STATUS=$(az containerapp revision list \
                        --name "$(containerAppName)" \
                        --resource-group "$(resourceGroup)" \
                        --query "[0].properties.runningState" \
                        --output tsv)
                      echo "Latest revision running state: $STATUS"
                      if [[ "$STATUS" != "Running" ]]; then
                        echo "##vso[task.logissue type=warning]Revision is not Running yet: $STATUS"
                      fi
